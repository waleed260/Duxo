# §10.1 / §10.2 — deploy the Firebase security rules.
#
# The rules files have lived in `firebase/` since the start with nothing that
# applies them, and there was no `firebase.json` for the CLI to read, so every
# rule in the repo was a document rather than a deployed control. That is the
# worst failure mode available here: the rules are the *only* thing standing
# between a signed-in account and another user's session, and a repo full of
# careful rules reads exactly like a project that has deployed them.
#
# §0.13 item 5 — "Deploy RTDB + Firestore security rules before any user data".
#
# Runs on any change to the rules, so tightening a rule cannot be merged and
# then silently left unapplied.
name: Deploy Firebase Rules

on:
  push:
    # Not just main. The validate job below exists to catch a broken ruleset
    # before it is live, and it was only ever reachable on the default branch —
    # so it ran after the merge it was meant to gate. The deploy job stays
    # pinned to main by its own `if`.
    branches: [main, master, "feat/**", "fix/**"]
    paths:
      - "firebase/**"
      - "firebase.json"
      - "viewer/firestore.indexes.json"
      - "viewer/rules-tests/**"
      - "viewer/vitest.rules.config.ts"
      - ".github/workflows/deploy-rules.yml"
  pull_request:
    paths:
      - "firebase/**"
      - "firebase.json"
      - "viewer/rules-tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a malformed rules file on every branch and PR, including the
      # ones that never reach the deploy job below. A syntax error here would
      # otherwise surface as a failed deploy after merge, at which point the
      # live rules are whatever was deployed last.
      - name: Check database.rules.json parses
        run: |
          python3 - <<'PY'
          import json, re, sys
          raw = open("firebase/database.rules.json").read()
          # The file is JSON-with-comments by convention; strip line comments
          # the same way the Firebase CLI does before parsing.
          stripped = re.sub(r'^\s*//.*$', '', raw, flags=re.M)
          rules = json.loads(stripped)
          assert "rules" in rules, "top-level 'rules' key is missing"
          for node in ("sessions", "codes", "pairings", "auditLog"):
              assert node in rules["rules"], f"{node} rules disappeared"
          # §0.7 — codes must never be client-readable. This is a one-line
          # change away from re-opening the enumeration hole, so it is asserted
          # rather than left to review.
          assert rules["rules"]["codes"]["$code"][".read"] is False, \
              "codes/$code must not be client-readable (§0.7)"
          print("database.rules.json OK")
          PY

      # Structure is not semantics. Everything above asserts that a clause is
      # present; none of it can tell whether the ruleset COMPILES, and one did
      # not: `!newData.child('claimed').val()` is a type error, because `.val()`
      # is null when the child is absent and RTDB's `!` only takes booleans.
      # That rejected the whole file on deploy — not one rule, the file — and
      # the only way to find out was to attempt a deploy, which had never
      # succeeded. The emulator compiles the rules and runs them against real
      # requests, and needs no credential to do it: a demo project id is enough.
      - uses: actions/setup-node@v4
        with:
          node-version-file: viewer/.nvmrc
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        working-directory: viewer
        run: npm ci

      # Java is preinstalled on ubuntu-latest; the database emulator is a JAR.
      - name: Compile and exercise the rules
        working-directory: viewer
        run: npm run test:rules

  deploy:
    name: Deploy rules
    needs: validate
    # Only from the default branch: a rules deploy is global and immediate,
    # with no per-branch preview to roll back to.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Two credentials are accepted, preferring the service account:
      # firestore-backup.yml already uses FIREBASE_SERVICE_ACCOUNT, so a repo
      # that can run backups can deploy rules with no extra setup, and
      # `firebase login:ci` (which mints FIREBASE_TOKEN) is deprecated.
      - name: Deploy database and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Not hardcoded: the id here was `duxo-remote`, while the app is
          # configured against a different project entirely, so this job
          # would have deployed to the wrong place — or to nothing.
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::Set the FIREBASE_PROJECT_ID repository variable to the" \
                 "project the app actually uses (see viewer/.env.local). It was" \
                 "hardcoded to a different project than the one the app targets."
            exit 1
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          elif [ -z "${FIREBASE_TOKEN:-}" ]; then
            # Failing here is the point. A green check on a job that deployed
            # nothing is how the rules in this repo stayed undeployed for
            # months while reading, to anyone glancing at CI, as applied.
            echo "::error::No Firebase credential. Set FIREBASE_SERVICE_ACCOUNT" \
                 "(base64 of a service-account JSON key, as firestore-backup.yml" \
                 "uses) or FIREBASE_TOKEN. The rules in this repo are NOT deployed."
            exit 1
          fi
          firebase deploy \
            --only database,firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
