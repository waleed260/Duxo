name: Rollback Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Git commit SHA or tag to rollback to"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy pinned version
        run: |
          cd viewer
          npm ci
          npm run build
          cd ..
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Not hardcoded: the id here was `duxo-remote`, while the app is
          # configured against a different project entirely, so this job
          # would have deployed to the wrong place — or to nothing.
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
