[package]
name = "duxo-host"
version = "0.1.0"
description = "Duxo host agent — Tauri v2 + Rust remote desktop host"
authors = ["Duxo Contributors"]
license = "MIT"
repository = "https://github.com/waleed260/Duxo"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# §0.5 — WebRTC via webrtc-rs
webrtc = "0.11"

# §2.5 — JWT verification (Firebase ID token → Google public certs)
jsonwebtoken = "9"
# rustls, not native-tls: the plan's "portable single binary, no installer"
# goal (§0.4) is undermined by linking OpenSSL, which then has to be present
# at the right version on every target machine. rustls is statically linked
# and removes libssl from the build and runtime requirements entirely.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# §2.6 — OS-native secure storage (Windows Credential Manager / Linux Secret Service)
# keyring 3 selects no credential store unless a backend feature is named —
# with none, it silently compiles in a mock store that keeps "secrets" in a
# process-local HashMap. That would look like it worked and persist nothing.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# §0.5 — VP8 video encoding.
# NOT provided by webrtc-rs: that crate is transport-only and carries media
# that is already compressed. Requires libvpx (libvpx-dev on Debian/Ubuntu).
# `ffi-generate` runs bindgen against the system libvpx headers. Without it the
# crate falls back to bindings pre-generated for a fixed set of libvpx
# versions, and panics at build time on any other — Ubuntu 24.04 ships 1.14.0,
# for which no pre-generated file exists. Costs a libclang dependency at build
# time only; nothing is added to the shipped binary.
vpx-encode = { version = "0.6", features = ["ffi-generate"] }

# §0.5 — Screen capture
# Cross-platform: scrap (DXGI on Windows, XShm on Linux)
scrap = "0.5"

# §1.6 — logging (local rotating file, no cloud logging bill)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# §7.2 — memory hygiene (zeroize secrets on drop)
zeroize = { version = "1", features = ["derive"] }

# §7.3 — SHA-256 hash chain for audit log
sha2 = "0.10"

# §1.4 — file_chunk payloads arrive base64-encoded over the data channel.
base64 = "0.22"

# Random (session ID / 8-digit code generation)
rand = "0.8"

# §1.5 — self-update check (GitHub Releases API, free)
chrono = "0.4"

# §10.3b — error derivation
thiserror = "1"

# §1.5 — semver for version comparison in update check
semver = "1"

# §7.1 — Tauri updater for secure in-app updates
tauri-plugin-updater = "2"

# §1.6 — log directory resolution
dirs = "5"

# §7.6 — separate .env.development / .env.production. Tauri does not load a
# .env on its own, so without this the host agent starts with every Firebase
# setting empty and fails at the first RTDB write.
dotenvy = "0.15"

# §2.4 — URL encoding for Allow/Deny window query params
urlencoding = "2"

# ─── Platform-specific dependencies ───
#
# These tables MUST stay at the end of the dependency section. A
# `[target.'cfg(...)'.dependencies]` header ends [dependencies]: everything
# declared after it belongs to that target only. They used to sit in the
# middle of the list, which quietly made tracing, tracing-subscriber, zeroize,
# sha2, base64, rand, chrono, thiserror, semver, dirs, dotenvy, urlencoding and
# the updater plugin Linux-only — so Linux built fine and Windows failed with
# a dozen "unresolved import" errors for crates that were plainly in the file.

# Windows-specific: DXGI Desktop Duplication (future optimization)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_UI_WindowsAndMessaging",
], optional = true }
enigo = { version = "0.2", features = ["serde"] }

# Linux X11: x11rb for X11-specific features
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["all-extensions"], optional = true }
enigo = { version = "0.2", features = ["serde"] }

[features]
default = []
# §0.5 — feature flags for display-server backends
capture-x11 = ["x11rb"]
capture-wayland = []
